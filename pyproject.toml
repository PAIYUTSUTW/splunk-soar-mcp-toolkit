[build-system]
requires = ["setuptools>=80.9,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "splunk-soar-mcp-toolkit"
version = "0.3.1"
description = "Portable, evidence-preserving Splunk SOAR MCP tools"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["mcp==1.30.0", "httpx==0.28.1"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "trustme==1.2.1"]

[project.scripts]
soar-mcp = "soar_mcp.server:main"

[project.urls]
Repository = "https://github.com/PAIYUTSUTW/splunk-soar-mcp-toolkit"
Issues = "https://github.com/PAIYUTSUTW/splunk-soar-mcp-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/splunk-soar-mcp-toolkit" = ["README.md", "SOURCES.md", "SECURITY.md", "CONTRIBUTING.md"]
"share/splunk-soar-mcp-toolkit/docs" = ["docs/CLIENTS.md"]
"share/splunk-soar-mcp-toolkit/examples" = ["examples/readonly.env", "examples/owned.env"]

[tool.pytest.ini_options]
testpaths = ["tests"]
